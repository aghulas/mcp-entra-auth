[project]
name = "mcp-entra-auth"
version = "0.2.0"
description = "Authentification Entra ID (Azure AD) reutilisable pour un serveur MCP en transport streamable-http (Copilot 365 / Copilot Studio)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_entra_auth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
